name: CI
on: { push: { branches: [main] }, pull_request: }
jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install ruff pytest torch torchvision pytorch-lightning
      - run: ruff check .
      - run: pytest -q tests/
  docker:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t deepvision-api:${{ github.sha }} ./api
      - run: docker build -t deepvision-trainer:${{ github.sha }} ./training
