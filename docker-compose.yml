version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dv
      POSTGRES_PASSWORD: dv
      POSTGRES_DB: dv
    ports: ["5432:5432"]
    volumes: [dv-db:/var/lib/postgresql/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [dv-minio:/data]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    command: >
      sh -c "pip install psycopg2-binary boto3 &&
             mlflow server --host 0.0.0.0
             --backend-store-uri postgresql://dv:dv@postgres/dv
             --default-artifact-root s3://mlflow/
             --serve-artifacts --artifacts-destination s3://mlflow/"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports: ["5000:5000"]
    depends_on: [postgres, minio]

  trainer:
    build: ./training
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./training:/app
      - ./data:/data
    depends_on: [mlflow]

  api:
    build: ./api
    ports: ["8000:8000"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/deepvision-classifier/Production
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    depends_on: [mlflow]

  ui:
    build: ./ui
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on: [api]

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  dv-db:
  dv-minio:
